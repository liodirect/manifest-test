<!DOCTYPE html>
<html lang="zh">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<title>显化卡点测试</title>
<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    background: #f6f4f1;
    margin: 0;
    padding: 0;
}

.container {
    max-width: 480px;
    margin: auto;
    padding: 20px;
}

canvas{
max-width:100%;
margin-top:10px;
margin-bottom:10px;
}

.small-text{
font-size:14px;
line-height:1.6;
color:#444;
margin-bottom:12px;
}

h1 {
    font-size: 22px;
    margin-bottom: 20px;
}

button {
    width: 100%;
    margin: 10px 0;
    padding: 14px;
    border: none;
    background: #6b5b95;
    color: white;
    border-radius: 12px;
    font-size: 15px;
}

button:hover {
    opacity: 0.9;
}

.hidden {
    display: none;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 18px;
    margin: 20px 0;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
}

.big-title {
    font-size: 28px;
    font-weight: bold;
    text-align: center;
}

.big-percent {
    font-size: 52px;
    font-weight: bold;
    color: #6b5b95;
    text-align: center;
    margin-top: 6px;
}

#subTypes{
    text-align:center;
    margin-top:10px;
}

.subtitle {
    font-size: 14px;
    color: #666;
    margin-top: 6px;
}

.section-title {
    font-weight: bold;
    margin-bottom: 10px;
}

.small-text {
    font-size: 14px;
    line-height: 1.6;
    color: #444;
}

canvas {
    max-width: 100%;
}

.download-btn {
    background: black;
}

.result-header{
text-align:center;
margin-bottom:30px;
}

.result-type{
font-size:26px;
font-weight:bold;
margin-bottom:10px;
}

.score-box{
margin:10px 0;
}

.score-label{
font-size:18px;
color:#666;
}

.score-value{
font-size:56px;
font-weight:bold;
color:#7b6cff;
}

.subtype{
font-size:15px;
color:#444;
margin-top:10px;
}

canvas{
    width:100% !important;
    max-width:420px;
    margin:30px auto;
    display:block;
}

.advice-box{
    background:#f5f5f7;
    padding:15px;
    border-radius:12px;
}

.share-tip{
    text-align:center;
    font-size:14px;
    color:#666;
    margin-top:15px;
    margin-bottom:10px;
}

function scaleScore(score, maxScore = 12) {
    return 45 + (score / maxScore) * 50;
}

function calculateResistance(totalScore) {
    const maxScore = 72;
    return Math.round(30 + (totalScore / maxScore) * 50);
}
</style>
</head>

<body>

<div class="container">

<h1 id="title">你的显化卡点是什么？</h1>

<div id="start">
    <p>这个测试将帮助你识别当前显化过程中最核心的阻力。</p>
    <button onclick="startTest()">开始测试</button>
</div>

<div id="quiz" class="hidden">
    <h2 id="question"></h2>
    <div id="options"></div>
</div>

<div id="result" class="hidden">

    <!-- 1 主类型区 -->
    <div class="result-header">

<div class="result-type" id="resultType"></div>

<div class="score-box">
<div class="score-label">阻力指数</div>
<div class="score-value" id="resultScore"></div>
</div>

<div class="subtype" id="subType"></div>

</div>

    <!-- 2 雷达图 -->
    <div class="card">
        <div class="section-title">显化结构图</div>
        <canvas id="radarChart"></canvas>
    </div>

    <!-- 维度解释 -->
    <div class="card">
        <div class="section-title">六维含义说明</div>
        <div class="small-text">
            信念稳定度：你是否真正认领目标<br><br>
            情绪波动度：是否放大“还没有”的感觉<br><br>
            行动对齐度：现实动作是否匹配目标<br><br>
            身份承载力：是否允许自己升级<br><br>
            控制执念度：是否强行掌控结果<br><br>
            潜意识抗拒度：是否在关键时刻回避
        </div>
    </div>

    <!-- 3 行动建议 -->
    <div class="card">
        <div class="section-title">专属行动建议</div>
        <div id="actionAdvice" class="small-text advice-box"></div>
    </div>

    <!-- 4 结语 + 下载 -->
    <div class="card">
        <div class="small-text">
            显化不是许愿，而是结构调整。  
            当结构改变，现实会慢慢跟上。
        </div>
        <div class="share-tip">与朋友分享你的测试结果类型</div>
<button class="download-btn" onclick="downloadResult()">下载结果图片</button>
    </div>

</div>
<script>

const questions = [

/* 第一阶段：信念层 */

{
q:"当你想到理想生活时，你的第一反应是？",
options:[
{text:"那是我未来一定会进入的生活",scores:{belief:0}},
{text:"我相信有机会实现",scores:{belief:1}},
{text:"感觉需要很大的运气",scores:{belief:2}},
{text:"更像是别人的人生",scores:{belief:3}}
]
},

{
q:"当你看到别人实现类似目标时，你会？",
options:[
{text:"觉得这说明我也可以",scores:{belief:0}},
{text:"觉得有可能，但不容易",scores:{belief:1}},
{text:"觉得他们条件更好",scores:{belief:2}},
{text:"感觉那是另一个世界",scores:{belief:3}}
]
},

{
q:"当你设定一个重要目标时，你内心更像？",
options:[
{text:"这是我未来的一部分",scores:{belief:0}},
{text:"希望能够实现",scores:{belief:1}},
{text:"有点不确定是否适合我",scores:{belief:2}},
{text:"感觉目标有些遥远",scores:{belief:3}}
]
},

{
q:"当你想象未来的自己时？",
options:[
{text:"画面清晰且真实",scores:{belief:0}},
{text:"有些画面但不稳定",scores:{belief:1}},
{text:"偶尔能想象",scores:{belief:2}},
{text:"很难想象具体样子",scores:{belief:3}}
]
},

{
q:"当你谈到自己的目标时，你通常？",
options:[
{text:"很自然地表达",scores:{belief:0}},
{text:"只和少数人说",scores:{belief:1}},
{text:"有点不好意思说",scores:{belief:2}},
{text:"很少提起",scores:{belief:3}}
]
},

{
q:"如果目标真的实现，你最真实的感觉可能是？",
options:[
{text:"那是理所当然的升级",scores:{identity:0}},
{text:"会有一点不真实",scores:{identity:1}},
{text:"可能需要时间适应",scores:{identity:2}},
{text:"会担心自己配不配得上",scores:{identity:3}}
]
},

/* 第二阶段：情绪层 */

{
q:"当事情暂时没有进展时，你通常会？",
options:[
{text:"继续过好自己的生活",scores:{anxiety:0}},
{text:"偶尔会想是不是哪里没做好",scores:{anxiety:1}},
{text:"会反复思考原因",scores:{anxiety:2}},
{text:"容易开始焦虑",scores:{anxiety:3}}
]
},

{
q:"当你等待一个重要结果时，你通常？",
options:[
{text:"基本不会刻意去想",scores:{anxiety:0}},
{text:"偶尔想起",scores:{anxiety:1}},
{text:"会频繁关注",scores:{anxiety:2}},
{text:"很难停止思考",scores:{anxiety:3}}
]
},

{
q:"当你感觉事情变慢时，你的情绪是？",
options:[
{text:"依然稳定",scores:{anxiety:0}},
{text:"偶尔波动",scores:{anxiety:1}},
{text:"有点焦虑",scores:{anxiety:2}},
{text:"很容易陷入担心",scores:{anxiety:3}}
]
},

{
q:"当别人问你进展时，你通常感觉？",
options:[
{text:"很自然回答",scores:{anxiety:0}},
{text:"有一点压力",scores:{anxiety:1}},
{text:"不太想解释",scores:{anxiety:2}},
{text:"会有明显焦虑",scores:{anxiety:3}}
]
},

{
q:"当事情不按预期发展时，你会？",
options:[
{text:"很快调整",scores:{control:0}},
{text:"需要一点时间接受",scores:{control:1}},
{text:"会反复思考哪里失控",scores:{control:2}},
{text:"很难接受这种变化",scores:{control:3}}
]
},

{
q:"当你想到未来的不确定性时？",
options:[
{text:"觉得充满可能",scores:{control:0}},
{text:"既期待又有点担心",scores:{control:1}},
{text:"更希望事情可预测",scores:{control:2}},
{text:"希望一切都能控制",scores:{control:3}}
]
},

/* 第三阶段：行动层 */

{
q:"你为目标投入行动的稳定度？",
options:[
{text:"持续稳定",scores:{action:0}},
{text:"偶尔中断",scores:{action:1}},
{text:"常常拖延",scores:{action:2}},
{text:"很多时候停留在计划",scores:{action:3}}
]
},

{
q:"你的日常安排与目标关系？",
options:[
{text:"大多数事情在靠近它",scores:{action:0}},
{text:"部分相关",scores:{action:1}},
{text:"关联不太稳定",scores:{action:2}},
{text:"其实关系不大",scores:{action:3}}
]
},

{
q:"当需要开始一件重要事情时，你通常？",
options:[
{text:"很快行动",scores:{action:0}},
{text:"准备一下再开始",scores:{action:1}},
{text:"拖一段时间",scores:{action:2}},
{text:"经常迟迟不开始",scores:{action:3}}
]
},

{
q:"当你有一个新想法时，你通常？",
options:[
{text:"很快尝试",scores:{action:0}},
{text:"先观察一段时间",scores:{action:1}},
{text:"会想很多可能风险",scores:{action:2}},
{text:"最后常常没有行动",scores:{action:3}}
]
},

{
q:"面对需要改变习惯的事情，你会？",
options:[
{text:"逐渐调整",scores:{action:0}},
{text:"有时坚持有时放松",scores:{action:1}},
{text:"很难持续",scores:{action:2}},
{text:"经常放弃",scores:{action:3}}
]
},

{
q:"当行动开始产生压力时，你会？",
options:[
{text:"继续推进",scores:{action:0}},
{text:"偶尔暂停",scores:{action:1}},
{text:"会减少行动",scores:{action:2}},
{text:"很容易停下来",scores:{action:3}}
]
},

/* 第四阶段：潜意识层 */

{
q:"当一个机会突然出现时，你通常？",
options:[
{text:"会主动抓住",scores:{resistance:0}},
{text:"会认真评估",scores:{resistance:1}},
{text:"会犹豫很久",scores:{resistance:2}},
{text:"容易因此错过",scores:{resistance:3}}
]
},

{
q:"当生活真的开始变化时，你感觉？",
options:[
{text:"自然适应",scores:{identity:0}},
{text:"需要一点时间",scores:{identity:1}},
{text:"会有些不安",scores:{identity:2}},
{text:"有点想回到熟悉状态",scores:{identity:3}}
]
},

{
q:"当别人对你有更高期待时，你会？",
options:[
{text:"自然接受",scores:{identity:0}},
{text:"有一点压力",scores:{identity:1}},
{text:"担心达不到",scores:{identity:2}},
{text:"希望别人降低期待",scores:{identity:3}}
]
},

{
q:"当事情发展超出预期时，你会？",
options:[
{text:"顺势接受",scores:{control:0}},
{text:"尝试适应",scores:{control:1}},
{text:"有点不安",scores:{control:2}},
{text:"很想重新掌控",scores:{control:3}}
]
},

{
q:"当需要迈出关键一步时，你通常？",
options:[
{text:"直接行动",scores:{resistance:0}},
{text:"会犹豫一下",scores:{resistance:1}},
{text:"经常拖延",scores:{resistance:2}},
{text:"很容易绕开",scores:{resistance:3}}
]
},

{
q:"当你离目标越来越近时，你的感觉是？",
options:[
{text:"兴奋和期待",scores:{resistance:0}},
{text:"有一点紧张",scores:{resistance:1}},
{text:"会开始怀疑自己",scores:{resistance:2}},
{text:"有时会不自觉退缩",scores:{resistance:3}}
]
}

];

let current = 0;
let scores = {
    belief: 0,
    anxiety: 0,
    action: 0,
    identity: 0,
    control: 0,
    resistance: 0
};

function startTest() {
    document.getElementById("start").classList.add("hidden");
    document.getElementById("quiz").classList.remove("hidden");
    showQuestion();
}

function showQuestion() {
    const q = questions[current];
    document.getElementById("question").innerText = q.q;
    const optionsDiv = document.getElementById("options");
    optionsDiv.innerHTML = "";
    q.options.forEach(option => {
        const btn = document.createElement("button");
        btn.innerText = option.text;
        btn.onclick = () => selectOption(option.scores);
        optionsDiv.appendChild(btn);
    });
}

function selectOption(optionScores) {

    for (let key in optionScores) {
        scores[key] += optionScores[key];
    }

    current++;

    if (current < questions.length) {
        showQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById("quiz").classList.add("hidden");
    document.getElementById("result").classList.remove("hidden");

    const maxType = Object.keys(scores).reduce((a, b) =>
        scores[a] > scores[b] ? a : b
    );
const sorted = Object.keys(scores)
    .sort((a,b) => scores[b] - scores[a]);

const main = sorted[0];
const second = sorted[1];
const third = sorted[2];

const total = Object.values(scores).reduce((a,b)=>a+b,0);
const mainPercent = total === 0 ? 0 : Math.round((scores[main] / total) * 100);
    const results = {

belief: {
title: "信念未认领型",
core: "你想要结果，但内在没有真正认领它。",
action: "连续7天写下：我已经是能拥有这件事的人，并做一个现实行动。"
},

anxiety: {
title: "焦虑拉扯型",
core: "你太关注结果是否发生。",
action: "每天10分钟想象成功后的稳定生活，而不是成功瞬间。"
},

action: {
title: "行动错位型",
core: "你的现实行动还没有完全对齐目标。",
action: "48小时内完成一个拖延已久的关键动作。"
},

identity: {
title: "身份承载不足型",
core: "潜意识担心升级后的责任。",
action: "写下成功后你最害怕的三件事，并拆解它们。"
},

control: {
title: "控制执念型",
core: "你太想控制事情如何发生。",
action: "练习设定目标后不再反复检查进度，把注意力放回日常行动。"
},

resistance: {
title: "潜意识回避型",
core: "在关键时刻，你会下意识拖延或绕开机会。",
action: "当出现关键机会时，要求自己在24小时内做出一个回应。"
}

};

document.getElementById("resultType").innerText =
results[main].title;

document.getElementById("resultScore").innerText =
mainPercent + "%";

document.getElementById("subType").innerHTML =
    "你也可能是：" +
    results[second].title +
    (scores[third] > 0 ? " / " + results[third].title : "");

document.getElementById("actionAdvice").innerHTML =
    results[main].action;


// 根据得分生成雷达数据
const canvas = document.getElementById("radarChart");
const ctx = canvas.getContext("2d");

new Chart(ctx, {
    type: 'radar',
    data: {
        labels: [
            '信念稳定度',
            '情绪波动度',
            '行动对齐度',
            '身份承载力',
            '控制执念度',
            '潜意识抗拒度'
        ],
        datasets: [{
            label: '显化阻力指数',
            data: [
    (scores.belief / 12) * 100,
    (scores.anxiety / 12) * 100,
    (scores.action / 12) * 100,
    (scores.identity / 12) * 100,
    (scores.control / 12) * 100,
    (scores.resistance / 12) * 100
],
backgroundColor: "rgba(54,162,235,0.35)",
borderColor: "rgba(54,162,235,1)",
borderWidth: 2,
pointBackgroundColor: "rgba(54,162,235,1)"
        }]
    },
options: {
    responsive: true,

    plugins: {
        tooltip: {
            callbacks: {
                label: function(context) {
                    return context.label + ": " + Math.round(context.raw) + "%";
                }
            }
        }
    },

    scales: {
        r: {
            min: 30,
            max: 100,
            ticks: {
                display: false
            },
            pointLabels: {
                font: {
                    size: 14
                },
                padding: 10,
                centerPointLabels: true
            }
        }
    }
}
});
}
function downloadResult() {

const btn = document.querySelector(".download-btn");
btn.style.display = "none";

html2canvas(document.getElementById("result"), {
    scale: 2,
    backgroundColor: "#ffffff"
}).then(canvas => {

const link = document.createElement("a");
link.download = "显化结果.png";
link.href = canvas.toDataURL();
link.click();

btn.style.display = "block";

});

}

</script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

</body>
</html>
